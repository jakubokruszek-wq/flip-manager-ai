# STAGE 1 ONLY — separate test Worker. Deploy with:
#   npx wrangler deploy --config wrangler.stage1.toml
#
# It is a different Worker ("flip-manager-olx-cloud-stage1"): its code, vars,
# secrets, Durable Object namespace and migrations are its own. The existing
# "flip-manager-olx-cloud" Worker and its configuration are NOT touched.
#
# It can never claim a job: OLX_CLOUD_STAGE1_LOCK="1" blocks claiming in code,
# in addition to OLX_CLOUD_ENABLED="0" and OLX_CLOUD_CLAIM_MODE="manual".
# Keep the remaining values identical to wrangler.toml (a test checks this).
name = "flip-manager-olx-cloud-stage1"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[build]
command = "node scripts/build-in-page-bundle.mjs"
watch_dir = ["src", "../../features/flip-finder"]

[browser]
binding = "BROWSER"

# Version id of the running code, reported by /status for the Worker and the
# Durable Object separately (the workflow waits until both run the new deploy).
[version_metadata]
binding = "CF_VERSION_METADATA"

[[durable_objects.bindings]]
name = "OLX_RUNNER"
class_name = "OlxCloudRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OlxCloudRunner"]

# One Cron Trigger (Workers Free: 5 per account) to show that the scheduler
# fires and stays inactive. Remove this section if the account limit is reached.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

[vars]
OLX_CLOUD_STAGE1_LOCK = "1"
OLX_CLOUD_ENABLED = "0"
OLX_CLOUD_CLAIM_MODE = "manual"
OLX_CLOUD_LISTING_ID_MODE = "stable_finder"
OLX_WORKER_API_URL = "https://flip-manager-ai.vercel.app"
OLX_CLOUD_WORKER_ID = "cloudflare-olx-stage1"
OLX_CLOUD_IDLE_POLL_SECONDS = "20"
OLX_CLOUD_IDLE_POLL_MAX_SECONDS = "40"
OLX_CLOUD_REFUSAL_PAUSE_THRESHOLD = "2"
OLX_CLOUD_REFUSAL_PAUSE_HOURS = "6"
OLX_CLOUD_DAILY_BROWSER_LIMIT_SECONDS = "600"
OLX_CLOUD_SAFE_BROWSER_BUDGET_SECONDS = "480"
OLX_CLOUD_SCRAPE_RESERVE_SECONDS = "35"
OLX_CLOUD_SESSION_MAX_SECONDS = "45"
OLX_CLOUD_KEEP_ALIVE_SECONDS = "20"
OLX_CLOUD_MAX_JOBS_PER_DAY = "0"
OLX_CLOUD_MAX_HELD_JOBS = "2"
OLX_CLOUD_MAX_JOBS_PER_INVOCATION = "2"
OLX_CLOUD_ON_BUDGET_EXHAUSTED = "fail_jobs"
OLX_CLOUD_BLOCK_HEAVY_RESOURCES = "1"
OLX_CLOUD_PAGE_JAVASCRIPT = "0"
OLX_CLOUD_RESTRICT_TO_OLX_DOMAINS = "0"
