# STAGE 2 — separate test Worker for ONE controlled Finder OLX job.
# Deployed only by .github/workflows/olx-cloudflare-stage2.yml:
#   npx wrangler deploy --config wrangler.stage2.toml
#
# A different Worker ("flip-manager-olx-cloud-stage2"): its code, vars,
# secrets, Durable Object namespace and migrations are its own. The existing
# "flip-manager-olx-cloud" and "flip-manager-olx-cloud-stage1" Workers are NOT
# touched.
#
# Safe by default: OLX_CLOUD_ENABLED="0", manual claim mode, NO Cron Trigger
# (nothing ever runs on a schedule; manual mode never arms an alarm). The
# workflow enables it only for the duration of one approved /run-once?jobId=…
# (deploy with --var OLX_CLOUD_ENABLED:1) and always redeploys it disabled.
name = "flip-manager-olx-cloud-stage2"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[build]
command = "node scripts/build-in-page-bundle.mjs"
watch_dir = ["src", "../../features/flip-finder"]

[browser]
binding = "BROWSER"

# Version id of the running code, reported by /status for the Worker and the
# Durable Object separately (the workflow waits until both run the new deploy).
[version_metadata]
binding = "CF_VERSION_METADATA"

[[durable_objects.bindings]]
name = "OLX_RUNNER"
class_name = "OlxCloudRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OlxCloudRunner"]

# No [triggers] section: no Cron Trigger at all.

[observability]
enabled = true

[vars]
OLX_CLOUD_ENABLED = "0"
OLX_CLOUD_CLAIM_MODE = "manual"
# Identical to what the local worker sends (parser ids); the stable-id switch is a separate decision.
OLX_CLOUD_LISTING_ID_MODE = "legacy"
OLX_WORKER_API_URL = "https://flip-manager-ai.vercel.app"
OLX_CLOUD_WORKER_ID = "cloudflare-olx-stage2"
OLX_CLOUD_IDLE_POLL_SECONDS = "20"
OLX_CLOUD_IDLE_POLL_MAX_SECONDS = "40"
OLX_CLOUD_REFUSAL_PAUSE_THRESHOLD = "1"
OLX_CLOUD_REFUSAL_PAUSE_HOURS = "24"
OLX_CLOUD_DAILY_BROWSER_LIMIT_SECONDS = "600"
# Safe browser budget for the test: 120 s of the 600 s Free allowance.
OLX_CLOUD_SAFE_BROWSER_BUDGET_SECONDS = "120"
OLX_CLOUD_SCRAPE_RESERVE_SECONDS = "35"
OLX_CLOUD_SESSION_MAX_SECONDS = "45"
OLX_CLOUD_KEEP_ALIVE_SECONDS = "20"
# "0" would mean NO limit. 1 = at most one job per UTC day.
OLX_CLOUD_MAX_JOBS_PER_DAY = "1"
OLX_CLOUD_MAX_HELD_JOBS = "1"
OLX_CLOUD_MAX_JOBS_PER_INVOCATION = "1"
# Never claim a job just to fail it: with the selective test nothing is claimed while paused anyway.
OLX_CLOUD_ON_BUDGET_EXHAUSTED = "leave_queued"
OLX_CLOUD_BLOCK_HEAVY_RESOURCES = "1"
OLX_CLOUD_PAGE_JAVASCRIPT = "0"
OLX_CLOUD_RESTRICT_TO_OLX_DOMAINS = "0"
