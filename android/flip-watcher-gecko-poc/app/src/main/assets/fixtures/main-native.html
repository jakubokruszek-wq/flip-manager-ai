<!doctype html><meta charset="utf-8"><title>Local integrated MAIN fixture</title>
<style>body{margin:0}#feed{height:400px;overflow:auto}#space{height:10000px}</style>
<div id="feed" role="feed"><div id="space"><article><p>Local fixture, no Facebook account.</p></article></div></div>
<script>
let sent=false;
// Save these BEFORE consent: the document_start relay must still observe their later calls.
const cachedFetch=window.fetch,cachedOpen=XMLHttpRequest.prototype.open,cachedSend=XMLHttpRequest.prototype.send;
document.getElementById('feed').addEventListener('scroll',()=>{
  if(sent)return;sent=true;
  const endpoint='/ajax/main-lab/?fixture=main-world-data';
  cachedFetch(endpoint).then(r=>r.text()).then(text=>{document.documentElement.dataset.fetchIntact=String(text.includes('LOCAL_MAIN_FIXTURE'));});
  const x=new XMLHttpRequest();cachedOpen.call(x,'GET',endpoint);x.onload=()=>{document.documentElement.dataset.xhrIntact=String(x.responseText.includes('LOCAL_MAIN_FIXTURE'));};cachedSend.call(x);
});
</script>
