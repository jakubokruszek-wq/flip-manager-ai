name: Deal Room Q&A isolated validation
on:
  pull_request:
    branches: [main, feat/deal-room-qa, feat/deal-room-market, feat/deal-room-cfo, feat/deal-room-tax-scenarios, feat/deal-room-tax-model, feat/deal-room-private-tax]
    paths: ['features/investment-os/**', 'app/(app)/flip-finder/page.tsx', 'app/(app)/deals/**', 'app/api/deal-room/**', 'features/flip-finder/underwriting.ts', 'app/api/flip-finder/listings/**/investment/**', 'supabase/drafts/deal-room-qa.sql', 'supabase/drafts/deal-room-test-storage.sql', 'scripts/test-deal-room-test-storage.py', 'scripts/test-deal-room-postgres.py', 'scripts/test-tax-arithmetic-reference.py', 'scripts/test-private-tax-reference.py', 'scripts/test-jdg-tax-reference.py', 'scripts/setup-deal-room-service.py', '.github/workflows/deal-room-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deal-room-qa-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
  DEAL_ROOM_QA_ENABLED: 'true'
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55999
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: isolated-only
  SUPABASE_SERVICE_ROLE_KEY: isolated-only
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint features/investment-os 'app/api/flip-finder/listings/[id]/investment' features/flip-finder/underwriting.ts 'app/(app)/flip-finder/page.tsx' 'app/(app)/deals' app/api/deal-room
      - name: Unit and existing regression with coverage
        run: node --import ./scripts/test-alias-loader.mjs --experimental-strip-types --experimental-test-module-mocks --test-isolation=none --experimental-test-coverage --test features/investment-os/*.test.ts features/investment-os/brain/*.test.ts features/investment-os/server/*.test.ts features/investment-os/components/*.test.ts features/flip-finder/underwriting.test.ts
      - name: Existing MARKET and Radar regressions
        run: node --import ./scripts/test-alias-loader.mjs --experimental-strip-types --test features/market-intelligence/*.test.mjs features/price-radar/qualification.test.ts features/price-radar/stats.test.ts
      - name: Independent decimal arithmetic reference
        run: python3 scripts/test-tax-arithmetic-reference.py
      - name: Independent full private transaction reference
        run: python3 scripts/test-private-tax-reference.py
      - name: Independent JDG tax and cash reference
        run: python3 scripts/test-jdg-tax-reference.py
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Mobile question answer save recalculate reload
        run: node --import ./scripts/test-alias-loader.mjs --experimental-strip-types --test features/investment-os/components/director-questions.browser.test.cjs
      - name: Existing Deal Room and Finder mobile browser regression
        run: node --import ./scripts/test-alias-loader.mjs --experimental-strip-types --test --test-concurrency=1 features/investment-os/components/deal-room.browser.test.cjs features/investment-os/brain/deal-room-brain.browser.test.cjs features/investment-os/components/investment-command-center.browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deal-room-mobile-evidence
          path: artifacts/deal-room-qa
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deal_test
          POSTGRES_PASSWORD: isolated-only
          POSTGRES_DB: deal_room_test
        ports: ['55438:5432']
        options: --health-cmd "pg_isready -U deal_test -d deal_room_test" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]==3.2.6'
      - name: Actual PostgreSQL CAS concurrency ownership replay and rollback
        run: python scripts/test-deal-room-postgres.py
      - name: Dedicated TEST SQL roles isolation CAS replay and rollback
        run: python scripts/test-deal-room-test-storage.py
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deal_test
          POSTGRES_PASSWORD: isolated-only
          POSTGRES_DB: deal_room_test
        ports: ['55438:5432']
        options: --health-cmd "pg_isready -U deal_test -d deal_room_test" --health-interval=5s --health-timeout=5s --health-retries=10
      rest:
        image: postgrest/postgrest:v12.2.12
        env:
          PGRST_DB_URI: postgres://deal_test:isolated-only@postgres:5432/deal_room_test
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: isolated-deal-room-postgrest-signing-key-only
        ports: ['55439:3000']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: pip install 'psycopg[binary]==3.2.6'
      - run: python scripts/setup-deal-room-service.py
      - name: Actual API handlers to existing Investment OS services to PostgREST to PostgreSQL
        run: node --import ./scripts/test-alias-loader.mjs --experimental-strip-types --experimental-test-module-mocks --test-isolation=none --test features/investment-os/test-fixtures/deal-room-postgrest.integration.ts
