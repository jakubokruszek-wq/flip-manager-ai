name: Finder filter settings UI

# Offline checks only: no Supabase, no portal, no Production request. The
# browser test builds the app and mocks the Finder API.
on:
  pull_request:
    branches: [main]
    paths:
      - "features/flip-finder/components/flip-finder-page.tsx"
      - "features/flip-finder/components/flip-finder-page.test.cjs"
      - "features/flip-finder/components/filter-settings-mobile.browser.test.cjs"
      - "components/ui/dialog.tsx"
      - "components/ui/button.tsx"
      - "app/globals.css"
      - ".github/workflows/finder-filter-settings-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finder-filter-settings-ui-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit -p .
      - name: ESLint
        run: npx eslint .
      - name: Finder page source tests
        run: node --test features/flip-finder/components/flip-finder-page.test.cjs
      - run: npx playwright install --with-deps chromium
      - name: Filter settings on phones and desktop (Playwright)
        run: node --test --test-concurrency=1 features/flip-finder/components/filter-settings-mobile.browser.test.cjs
