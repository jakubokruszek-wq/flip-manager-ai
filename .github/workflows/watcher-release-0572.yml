name: Publish tested Watcher 0.5.72
on:
  push:
    branches: [delivery/watcher-tested-0572]
    paths: [.github/workflows/watcher-release-0572.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require successful complete tests of exact application source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 41603637713 --repo jakubokruszek-wq/flip-manager-ai --exit-status --interval 45
          gh api repos/jakubokruszek-wq/flip-manager-ai/actions/runs/41603637713 > run.json
          jq -e '.head_sha == "0fda5a59c3023607932fc6bc3cb57dce21bdb5a4" and .conclusion == "success"' run.json
          gh api repos/jakubokruszek-wq/flip-manager-ai/actions/runs/41603637713/jobs > jobs.json
          jq -e '[.jobs[] | select(.name == "Compile, unit tests, APK" or .name == "Isolation, collector-core and adapter tests" or .name == "GeckoView instrumented tests (Android 16 emulator, local HTML)")] | length == 3 and all(.[]; .conclusion == "success")' jobs.json
      - name: Check deployed Manager authentication boundary
        run: |
          status=$(curl --silent --show-error --max-time 30 -o response.json -w '%{http_code}' https://flip-manager-ai.vercel.app/api/collector/facebook/mobile)
          test "$status" = 405
          status=$(curl --silent --show-error --max-time 30 -X POST -H 'Content-Type: application/json' --data '{}' -o response.json -w '%{http_code}' https://flip-manager-ai.vercel.app/api/collector/facebook/mobile)
          test "$status" = 401
          jq -e '.code == "PAIRING_REQUIRED"' response.json
      - uses: actions/download-artifact@v4
        with:
          name: gecko-candidate-arm64-541
          repository: jakubokruszek-wq/flip-manager-ai
          run-id: 41603637713
          github-token: ${{ github.token }}
          path: tested-apk
      - name: Publish identical tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv tested-apk/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk flip-watcher-0.5.72-arm64.apk
          echo '2c61d784219503b2bec8715703a171f4d8635557bd056082b228c317baeb5085  flip-watcher-0.5.72-arm64.apk' | sha256sum -c -
          unzip -p flip-watcher-0.5.72-arm64.apk assets/ext/flip_poc/collector-core.js | sha256sum | grep -q '^32c98525cfac6b580b93b4847140d4872ee4119b26981786322235df42e5b88b '
          cat > release-notes.md <<'NOTES'
          Android Watcher 0.5.72, ARM64, versionCode 8541. Exact APK from successful complete run 41603637713, application source 0fda5a59c3023607932fc6bc3cb57dce21bdb5a4; not rebuilt for publication.
          
          Main offers and automatic Manager uploads require confirmed property sale and at least one real stored post-bound photo. A text graphic counts. Uncertain/no-photo records stay local for review.
          Local cleanup uses a selected saved-date cutoff, preview and confirmation, preserves unknown historical dates and prevents removed queued offers from replaying. Manager has independent saved-date cleanup with CRM/deal protection.
          The one-time outbox upgrade revalidates eligible legacy snapshots with original replay keys and receipts.
          Manager production 2c62c3c769277a80beec1571cca181f0af6f75f8 and database migration deployed. Live negative import checks rejected no-photo, rental and unknown intent; temporary test device revoked.
          
          Tested with classifier/transport/SQL regressions and Android emulator fixtures. Private Facebook layout and manufacturer background restrictions still require normal phone operation; emulator tests do not prove every live Facebook variant.
          Install as update; do not uninstall or clear application data. Stable certificate SHA256 878b11e677eb4a62883b0b8709fa19c969926708053a01d47f01b0548fb370a2.
          APK SHA256 2c61d784219503b2bec8715703a171f4d8635557bd056082b228c317baeb5085.
          NOTES
          gh release create gecko-poc-0.5.72 flip-watcher-0.5.72-arm64.apk --repo jakubokruszek-wq/flip-manager-ai --target 0fda5a59c3023607932fc6bc3cb57dce21bdb5a4 --title 'Watcher 0.5.72 — property sales with photos and saved-date cleanup' --prerelease --notes-file release-notes.md
