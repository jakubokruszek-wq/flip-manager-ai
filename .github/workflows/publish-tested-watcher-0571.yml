name: Publish tested Flip Watcher 0.5.71
on:
  push:
    branches: ["delivery/watcher-tested-0571"]
    paths: [".github/workflows/publish-tested-watcher-0571.yml"]
permissions:
  contents: read
concurrency:
  group: publish-tested-watcher-0571
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: jakubokruszek-wq/flip-manager-ai
      TESTED_SHA: 53c17c2a2f3191a8502325614950133c163dfc71
    steps:
      - name: Require complete successful Android verification for the exact source
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            gh api "repos/$REPO/actions/runs/41507152176" > verified-run.json
            test "$(jq -r .head_sha verified-run.json)" = "$TESTED_SHA"
            status="$(jq -r .status verified-run.json)"
            conclusion="$(jq -r .conclusion verified-run.json)"
            echo "Android verification: $status / $conclusion"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 30
          done
          echo "Verification not complete; refusing release."
          exit 1
      - name: Require deployed Manager mobile endpoint
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 20 --request POST --header 'Content-Type: application/json' --data '{}' --output manager-check.json --write-out '%{http_code}' https://flip-manager-ai.vercel.app/api/collector/facebook/mobile)"
          test "$status" = 401
          jq -e '.code == "PAIRING_REQUIRED"' manager-check.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: flip-watcher-gecko-poc-arm64-532
          repository: jakubokruszek-wq/flip-manager-ai
          run-id: 41507152176
          github-token: ${{ github.token }}
          path: tested-apk
      - name: Verify original APK digest and publish without rebuilding
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/jobs/125489255031" > build-job.json
          jq -e '.run_id == 41507152176 and .conclusion == "success"' build-job.json
          gh api --allow-escape-sequences "repos/$REPO/actions/jobs/125489255031/logs" > build-job.log
          python3 - <<'PYCODE'
          import re
          from pathlib import Path
          hashes=set(re.findall(r"\b([0-9a-f]{64})  app/build/outputs/apk/debug/app-arm64-v8a-debug\.apk",Path("build-job.log").read_text()))
          assert len(hashes)==1, "Missing or ambiguous original APK digest"
          Path("apk.sha256").write_text(next(iter(hashes))+"  flip-watcher-0.5.71-arm64.apk\n")
          PYCODE
          mv tested-apk/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk flip-watcher-0.5.71-arm64.apk
          sha256sum -c apk.sha256
          if gh release view gecko-poc-0.5.71 --repo "$REPO" --json tagName > existing-release.json 2>/dev/null; then
            echo "Release exists; refusing to replace files."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          Flip Watcher 0.5.71 — wysyłka kolejki bez blokowanego startu usługi.

          Naprawia ANDROID_FOREGROUND_START_DENIED blokujące wysyłkę zapisanych ofert. Automat korzysta ze zwykłych, ograniczonych czasowo zadań WorkManager bez uruchamiania usługi foreground. Zapisane oferty mogą być wysyłane również przy otwartej aplikacji. Tylko skanowanie Gecko czeka na opuszczenie jej ekranu. Dłuższe skany są kontynuowane z trwałych potwierdzeń grup w następnych zadaniach.

          Instaluj jako aktualizację 0.5.70, bez odinstalowywania ani kasowania danych. Zachowuje istniejącą szyfrowaną kolejkę, klucze ponowień, potwierdzenia, bazę lokalną, logowanie, parowanie i godziny. Po aktualizacji wybierz Skan teraz w tle, aby zlecić obsługę kolejki i skan. Nie trzeba ponownie parować. Android nadal może opóźniać zadania ze względu na baterię, sieć i limity zadań.

          Nieprzebudowany APK z run 41507152176, źródło 53c17c2a2f3191a8502325614950133c163dfc71, versionCode 8532. Publikacja wymaga pełnego sukcesu kompilacji, JVM, JS, kontraktu/importera i testów Androida. Nowy test rzeczywistego CoroutineWorker zapisuje 31 ofert w szyfrowanej kolejce, symuluje utratę potwierdzenia, sprawdza niezmienność klucza i treści ponowienia oraz 31 unikalnych przyjęć bez powtórnej wysyłki po potwierdzeniu. Wstrzyknięty mechanizm odmawia każdego startu usługi foreground, a test wymaga zera takich startów. Sprawdza także wysyłkę przy widocznym UI. Testy używają lokalnych danych i syntetycznego odbiorcy; nie są potwierdzeniem działania na prywatnym koncie Facebook użytkownika.
          NOTES
          cat apk.sha256 >> release-notes.md
          gh release create gecko-poc-0.5.71 flip-watcher-0.5.71-arm64.apk --repo "$REPO" --target "$TESTED_SHA" --title 'Flip Watcher 0.5.71 — wysyłka bez blokady usługi' --prerelease --notes-file release-notes.md
