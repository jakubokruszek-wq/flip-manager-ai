name: Deliver verified Watcher 0.5.111
on:
  push:
    branches: [codex/android-runtime-lease-111-delivery]
    paths: [.github/workflows/android-gecko-poc.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require the exact successful source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/jakubokruszek-wq/flip-manager-ai/actions/runs/43649310458 --jq '.head_sha + " " + .conclusion' > source-run.txt
          grep -Fxq '03bff2e11aecc911a203fd63e902066d33746bbc success' source-run.txt
          test "$(gh api repos/jakubokruszek-wq/flip-manager-ai/git/ref/heads/codex/android-runtime-lease-111 --jq .object.sha)" = 03bff2e11aecc911a203fd63e902066d33746bbc
      - uses: actions/download-artifact@v4
        with:
          name: flip-watcher-gecko-poc-arm64-714
          repository: jakubokruszek-wq/flip-manager-ai
          run-id: 43649310458
          github-token: ${{ github.token }}
          path: tested-apk
      - name: Publish existing tested APK and deterministic ZIP without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk_path="$(find tested-apk -name app-arm64-v8a-debug.apk -type f)"
          test -n "$apk_path" && test -f "$apk_path"
          cp "$apk_path" flip-watcher-0.5.111-arm64.apk
          echo "3343178f064a82b1cdb826e12533a03db5ef8ca4f44fc82d155121c0bd9e7f77  flip-watcher-0.5.111-arm64.apk" | sha256sum -c -
          unzip -p flip-watcher-0.5.111-arm64.apk assets/ext/flip_poc/manifest.json | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(JSON.parse(s).version!=="0.5.111")process.exit(1)})'
          unzip -p flip-watcher-0.5.111-arm64.apk assets/ext/flip_poc/collector-core.js | sha256sum | grep -q '^32c98525cfac6b580b93b4847140d4872ee4119b26981786322235df42e5b88b '
          sha256sum flip-watcher-0.5.111-arm64.apk > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Android 0.5.111 — kontrolowana próba naprawy pauzy Gecko w tle.
          Nowy mechanizm działa wyłącznie w ręcznie wybranej czwartej próbie: Test obrazu → Rozpocznij porównanie → Sprawdź po schowaniu aplikacji → Próba naprawy pauzy Gecko. Zwykły skaner i pierwsze trzy tryby nie uruchamiają tej korekty.
          Próba kompensuje tylko zaobserwowaną pauzę przypiętego silnika Gecko158, przywraca stan po zakończeniu/anulowaniu i przed otwarciem okna, a raport zawiera liczniki wznowień oraz przywróceń. Nie wywołuje dodatkowego wznowienia zimnego, niewstrzymanego silnika. Używa wewnętrznego mechanizmu przypiętej biblioteki; nie jest to ogólny, wspierany przełącznik pracy Gecko w tle.
          Testy: dziewięć przypadków równowagi liczników; rzeczywista próba JNI, przechwycenie obrazu w tle, zakończenie, powrót do UI podczas próby, brak podwójnego przywrócenia i kolejne zwykłe przechwycenie. Test aktualizacji107→111 zachowuje kolejkę zdjęć/tekstów, parowanie, ustawienia i pliki. EmulatorAndroid16 nie zastępuje wyniku telefonuAndroid17.
          Instaluj jako aktualizację bez odinstalowywania. Kolejka ofert, logowanie, profil, harmonogram, ikona108 i opisy109 pozostają zachowane. Wysyłane są liczniki, bez zdjęć i treści ofert. Poczekaj około2minut po schowaniu aplikacji. Nie jest to jeszcze potwierdzona naprawa zwykłego skanowania.
          Source: 03bff2e11aecc911a203fd63e902066d33746bbc. Verified run: 43649310458.
          NOTES
          python3 - <<'PYZIP'
          import zipfile,pathlib,hashlib,json
          apk=pathlib.Path('flip-watcher-0.5.111-arm64.apk');output=pathlib.Path('flip-watcher-0.5.111-arm64.zip')
          info=zipfile.ZipInfo(apk.name,date_time=(2026,11,14,0,0,0));info.compress_type=zipfile.ZIP_STORED;info.external_attr=0o100644 << 16
          with zipfile.ZipFile(output,'w') as z:z.writestr(info,apk.read_bytes())
          with zipfile.ZipFile(output) as z:
              assert z.namelist()==[apk.name]
              assert hashlib.sha256(z.read(apk.name)).digest()==hashlib.sha256(apk.read_bytes()).digest()
          metadata={'url':'https://github.com/jakubokruszek-wq/flip-manager-ai/releases/download/gecko-poc-0.5.111/'+output.name,'filename':output.name,'bytes':output.stat().st_size,'sha256':hashlib.sha256(output.read_bytes()).hexdigest(),'apkFilename':apk.name,'apkBytes':apk.stat().st_size,'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest()}
          pathlib.Path('release-delivery.json').write_text(json.dumps(metadata));print(json.dumps(metadata))
          PYZIP
          gh release create gecko-poc-0.5.111 flip-watcher-0.5.111-arm64.apk flip-watcher-0.5.111-arm64.zip SHA256SUMS --repo jakubokruszek-wq/flip-manager-ai --target 03bff2e11aecc911a203fd63e902066d33746bbc --title 'Watcher 0.5.111 — próba naprawy pauzy Gecko' --prerelease --notes-file release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: android-111-delivery-metadata
          path: release-delivery.json
          retention-days: 14
  verify-download:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 03bff2e11aecc911a203fd63e902066d33746bbc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: android-111-delivery-metadata
          path: tested-delivery
      - run: npm ci --no-audit --no-fund
      - name: Use installed Chrome or install Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify ZIP full download, range resume, actual Chrome save and enclosed APK
        run: node android/flip-watcher-gecko-poc/scripts/verify-release-download.mjs tested-delivery/release-delivery.json

