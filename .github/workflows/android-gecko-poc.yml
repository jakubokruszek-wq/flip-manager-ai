name: Read-only pinned Gecko refresh-driver audit
on:
  push:
    branches: [codex/android-refresh-driver-audit-114]
    paths: [.github/workflows/android-gecko-poc.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect exact pinned Java source and embedded Gecko modules
        run: |
          set -euo pipefail
          base=https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/158.0.20261007201254/geckoview-158.0.20261007201254
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 45 "$base-sources.jar" -o sources.jar
          python3 - <<'PYSOURCE'
          import zipfile,re
          z=zipfile.ZipFile('sources.jar')
          names=[n for n in z.namelist() if re.search(r'Vsync|Surface|Compositor|Display|GeckoView.java|GeckoSession.java',n)]
          print('SOURCE_CANDIDATES',names)
          pattern=re.compile(r'Vsync|vsync|[Rr]efresh|[Bb]ackground|[Ff]oreground|[Vv]isib|[Aa]ctive|[Pp]ause|[Rr]esume|[Ss]urfaceControl|newSurfaceProvider|Choreographer|setPriorityHint')
          for n in names:
            if not n.endswith('.java'):continue
            lines=z.read(n).decode().splitlines()
            if 'GeckoSession.java' in n or 'GeckoView.java' in n or 'GeckoDisplay.java' in n or 'Vsync' in n or 'SurfaceWrapper' in n:
              indexes=set()
              for i,line in enumerate(lines):
                if pattern.search(line):
                  indexes.update(range(max(0,i-6),min(len(lines),i+13)))
              print('\nFILE',n)
              for i in sorted(indexes):print(f'{i+1}: {lines[i]}')
          PYSOURCE
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 90 "$base.aar" -o gecko.aar
          python3 - <<'PYEMBED'
          import zipfile,io,re
          a=zipfile.ZipFile('gecko.aar')
          print('AAR_METADATA',[n for n in a.namelist() if re.search(r'omni|application.ini|platform.ini|buildconfig|buildid',n,re.I)])
          for n in a.namelist():
            if n.endswith(('application.ini','platform.ini','buildconfig.yml')):print(n,a.read(n).decode(errors='replace')[:12000])
            if n.endswith('omni.ja'):
              z=zipfile.ZipFile(io.BytesIO(a.read(n)))
              candidates=[p for p in z.namelist() if re.search(r'GeckoView|geckoview-prefs|Vsync|AppConstants|application.ini|platform.ini',p)]
              print('OMNI_CANDIDATES',candidates)
              pattern=re.compile(r'GeckoView:SetActive|setActive|Vsync|vsync|frame_rate|refreshdriver|[Pp]ause|[Rr]esume|setIsActive|isActive|visibility|source.?stamp|SOURCE|MOZ_APP_VERSION')
              for p in candidates:
                if not p.endswith(('.mjs','.js','.ini')):continue
                lines=z.read(p).decode(errors='replace').splitlines()
                indexes=set()
                for i,line in enumerate(lines):
                  if pattern.search(line):indexes.update(range(max(0,i-4),min(len(lines),i+9)))
                if indexes:
                  print('\nOMNI_FILE',p)
                  for i in sorted(indexes):print(f'{i+1}: {lines[i]}')
          PYEMBED
