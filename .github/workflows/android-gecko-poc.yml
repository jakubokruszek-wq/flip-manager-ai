name: Deliver verified Watcher 0.5.114
on:
  push:
    branches: [codex/android-frame-signal-114-delivery]
    paths: [.github/workflows/android-gecko-poc.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require the exact successful source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/jakubokruszek-wq/flip-manager-ai/actions/runs/43718322046 --jq '.head_sha + " " + .conclusion' > source-run.txt
          grep -Fxq '36f0808bc74770032848357052ef419bf00dd087 success' source-run.txt
          test "$(gh api repos/jakubokruszek-wq/flip-manager-ai/git/ref/heads/codex/android-frame-signal-114 --jq .object.sha)" = 36f0808bc74770032848357052ef419bf00dd087
      - uses: actions/download-artifact@v4
        with:
          name: flip-watcher-gecko-poc-arm64-724
          repository: jakubokruszek-wq/flip-manager-ai
          run-id: 43718322046
          github-token: ${{ github.token }}
          path: tested-apk
      - name: Publish existing tested APK and deterministic ZIP without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk_path="$(find tested-apk -name app-arm64-v8a-debug.apk -type f)"
          test -n "$apk_path" && test -f "$apk_path"
          cp "$apk_path" flip-watcher-0.5.114-arm64.apk
          echo "bcfaa6871ecaef19a90e47fe0dd8766776befbbc69a9533b326904e4af5b14a1  flip-watcher-0.5.114-arm64.apk" | sha256sum -c -
          unzip -p flip-watcher-0.5.114-arm64.apk assets/ext/flip_poc/manifest.json | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(JSON.parse(s).version!=="0.5.114")process.exit(1)})'
          unzip -p flip-watcher-0.5.114-arm64.apk assets/ext/flip_poc/collector-core.js | sha256sum | grep -q '^32c98525cfac6b580b93b4847140d4872ee4119b26981786322235df42e5b88b '
          sha256sum flip-watcher-0.5.114-arm64.apk > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Android 0.5.114 — kontrolowana próba sygnału odświeżania Androida.
          Nowy wariant Test sygnału odświeżania Androida mierzy tę samą grupę, rozmiar, dokument i świeżą sesję. Pierwsze10sekund pozostawia bez własnego zapotrzebowania na klatki, po czym zgłasza publiczny callback Choreographer na głównym wątku — ten sam androidowy mechanizm, którego używa przypięte Gecko158. Raport porównuje liczniki sygnału Androida i timera głównego wątku z animacjami strony, timeremJS i klatkami ImageReader.
          Jest to jawny bodziec diagnostyczny, nie gwarantowany bierny pomiar ani potwierdzona naprawa. W tym wariancie nie zmieniamy powierzchni, preferencji silnika, pauzy Gecko ani priorytetu procesu. Nie uruchamiamy usługi pierwszego planu ani dodatkowej blokady wybudzenia. Callback działa do zakończenia próby przechwycenia obrazu i jest usuwany po zakończeniu lub anulowaniu.
          Użycie: Test obrazu → Rozpocznij porównanie. Po dwóch etapach wybierz Sprawdź po schowaniu aplikacji → Test sygnału odświeżania Androida. Poczekaj około2minut przed powrotem. Raport wyśle się automatycznie. Użyj tej samej grupy co wcześniej.
          Zwykły skaner i wcześniejsze warianty pozostają bez nowego callbacka. Instaluj jako aktualizację bez odinstalowywania; parowanie, kolejka zdjęć i tekstów, logowanie, ustawienia, harmonogram i branding są zachowane. Testy mechaniki na emulatorzeAPI36 nie zastępują wyniku telefonuAPI37.
          Source: 36f0808bc74770032848357052ef419bf00dd087. Verified run: 43718322046.
          NOTES
          python3 - <<'PYZIP'
          import zipfile,pathlib,hashlib,json
          apk=pathlib.Path('flip-watcher-0.5.114-arm64.apk');output=pathlib.Path('flip-watcher-0.5.114-arm64.zip')
          info=zipfile.ZipInfo(apk.name,date_time=(2026,11,14,0,0,0));info.compress_type=zipfile.ZIP_STORED;info.external_attr=0o100644 << 16
          with zipfile.ZipFile(output,'w') as z:z.writestr(info,apk.read_bytes())
          with zipfile.ZipFile(output) as z:
              assert z.namelist()==[apk.name]
              assert hashlib.sha256(z.read(apk.name)).digest()==hashlib.sha256(apk.read_bytes()).digest()
          metadata={'url':'https://github.com/jakubokruszek-wq/flip-manager-ai/releases/download/gecko-poc-0.5.114/'+output.name,'filename':output.name,'bytes':output.stat().st_size,'sha256':hashlib.sha256(output.read_bytes()).hexdigest(),'apkFilename':apk.name,'apkBytes':apk.stat().st_size,'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest()}
          pathlib.Path('release-delivery.json').write_text(json.dumps(metadata));print(json.dumps(metadata))
          PYZIP
          gh release create gecko-poc-0.5.114 flip-watcher-0.5.114-arm64.apk flip-watcher-0.5.114-arm64.zip SHA256SUMS --repo jakubokruszek-wq/flip-manager-ai --target 36f0808bc74770032848357052ef419bf00dd087 --title 'Watcher 0.5.114 — test sygnału odświeżania Androida' --prerelease --notes-file release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: android-114-delivery-metadata
          path: release-delivery.json
          retention-days: 14
  verify-download:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 36f0808bc74770032848357052ef419bf00dd087
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: android-114-delivery-metadata
          path: tested-delivery
      - run: npm ci --no-audit --no-fund
      - name: Use installed Chrome or install Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify ZIP full download, range resume, actual Chrome save and enclosed APK
        run: node android/flip-watcher-gecko-poc/scripts/verify-release-download.mjs tested-delivery/release-delivery.json


