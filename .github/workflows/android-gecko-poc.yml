name: Deliver verified Watcher 0.5.109
on:
  push:
    branches: [codex/android-photo-text-109-delivery]
    paths: [.github/workflows/android-gecko-poc.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require the exact successful source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/jakubokruszek-wq/flip-manager-ai/actions/runs/43591766354 --jq '.head_sha + " " + .conclusion' > source-run.txt
          grep -Fxq 'cb452ccc797ca36162b657eb92ae47b59fece041 success' source-run.txt
          test "$(gh api repos/jakubokruszek-wq/flip-manager-ai/git/ref/heads/codex/android-photo-text-109 --jq .object.sha)" = cb452ccc797ca36162b657eb92ae47b59fece041
      - uses: actions/download-artifact@v4
        with:
          name: flip-watcher-gecko-poc-arm64-701
          repository: jakubokruszek-wq/flip-manager-ai
          run-id: 43591766354
          github-token: ${{ github.token }}
          path: tested-apk
      - name: Publish existing tested APK and deterministic ZIP without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk_path="$(find tested-apk -name app-arm64-v8a-debug.apk -type f)"
          test -n "$apk_path" && test -f "$apk_path"
          cp "$apk_path" flip-watcher-0.5.109-arm64.apk
          echo "ef88e2aeb45c376da5408f18e6fb0caf3ee871a1646ea1845ffce044a93a8d28  flip-watcher-0.5.109-arm64.apk" | sha256sum -c -
          unzip -p flip-watcher-0.5.109-arm64.apk assets/ext/flip_poc/manifest.json | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(JSON.parse(s).version!=="0.5.109")process.exit(1)})'
          unzip -p flip-watcher-0.5.109-arm64.apk assets/ext/flip_poc/collector-core.js | sha256sum | grep -q '^32c98525cfac6b580b93b4847140d4872ee4119b26981786322235df42e5b88b '
          sha256sum flip-watcher-0.5.109-arm64.apk > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Android 0.5.109 — odczyt opisów ofert bez standardowego znacznika wiadomości.
          Zachowuje tekst jednoznacznie przypisanej oferty sprzedaży z ceną i metrażem. Nie pobiera komentarzy, udostępnionych postów ani niejednoznacznych opisów. Zwykły opis nie staje się planszą zdjęciową. Nie rozwiązuje wszystkich przypadków NO_TEXT: wymagane są jawne cena i metraż.
          Zachowuje ikonę 108, silnik skanowania, istniejące logowanie i kolejkę. Nie zmienia ani nie podnosi limitu kolejki quality_hold. Instaluj jako aktualizację bez odinstalowywania.
          Test aktualizacji 107 → 109 sprawdza kolejkę zdjęć i tekstów, parowanie, ustawienia i pliki. Test rzeczywistego obrazu na emulatorze sprawdza opis, cenę, metraż, zdjęcie własnego posta oraz gotowy zapis do wysyłki; wyklucza komentarz, udostępniony tekst i kilka niejednoznacznych opisów.
          Brak klatek obrazu na telefonie z Androidem 17 pozostaje nierozwiązany. Ta wersja nie zmienia renderera. Testy lokalne Androida 16 nie są potwierdzeniem odczytu konkretnego posta Facebooka.
          Source: cb452ccc797ca36162b657eb92ae47b59fece041. Verified run: 43591766354.
          NOTES
          python3 - <<'PYZIP'
          import zipfile,pathlib,hashlib,json
          apk=pathlib.Path('flip-watcher-0.5.109-arm64.apk');output=pathlib.Path('flip-watcher-0.5.109-arm64.zip')
          info=zipfile.ZipInfo(apk.name,date_time=(2026,11,14,0,0,0));info.compress_type=zipfile.ZIP_STORED;info.external_attr=0o100644 << 16
          with zipfile.ZipFile(output,'w') as z:z.writestr(info,apk.read_bytes())
          with zipfile.ZipFile(output) as z:
              assert z.namelist()==[apk.name]
              assert hashlib.sha256(z.read(apk.name)).digest()==hashlib.sha256(apk.read_bytes()).digest()
          metadata={'url':'https://github.com/jakubokruszek-wq/flip-manager-ai/releases/download/gecko-poc-0.5.109/'+output.name,'filename':output.name,'bytes':output.stat().st_size,'sha256':hashlib.sha256(output.read_bytes()).hexdigest(),'apkFilename':apk.name,'apkBytes':apk.stat().st_size,'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest()}
          pathlib.Path('release-delivery.json').write_text(json.dumps(metadata));print(json.dumps(metadata))
          PYZIP
          gh release create gecko-poc-0.5.109 flip-watcher-0.5.109-arm64.apk flip-watcher-0.5.109-arm64.zip SHA256SUMS --repo jakubokruszek-wq/flip-manager-ai --target cb452ccc797ca36162b657eb92ae47b59fece041 --title 'Watcher 0.5.109 — opisy i zdjęcia' --prerelease --notes-file release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: android-109-delivery-metadata
          path: release-delivery.json
          retention-days: 14
  verify-download:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cb452ccc797ca36162b657eb92ae47b59fece041
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: android-109-delivery-metadata
          path: tested-delivery
      - run: npm ci --no-audit --no-fund
      - name: Use installed Chrome or install Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify ZIP full download, range resume, actual Chrome save and enclosed APK
        run: node android/flip-watcher-gecko-poc/scripts/verify-release-download.mjs tested-delivery/release-delivery.json
