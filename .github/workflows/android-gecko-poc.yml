name: Deliver verified Watcher 0.5.112
on:
  push:
    branches: [codex/android-frame-timing-112-delivery]
    paths: [.github/workflows/android-gecko-poc.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require the exact successful source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/jakubokruszek-wq/flip-manager-ai/actions/runs/43702132914 --jq '.head_sha + " " + .conclusion' > source-run.txt
          grep -Fxq 'c89f49bc99bd03f4809fb0a558045cd4d21c2856 success' source-run.txt
          test "$(gh api repos/jakubokruszek-wq/flip-manager-ai/git/ref/heads/codex/android-frame-timing-112 --jq .object.sha)" = c89f49bc99bd03f4809fb0a558045cd4d21c2856
      - uses: actions/download-artifact@v4
        with:
          name: flip-watcher-gecko-poc-arm64-717
          repository: jakubokruszek-wq/flip-manager-ai
          run-id: 43702132914
          github-token: ${{ github.token }}
          path: tested-apk
      - name: Publish existing tested APK and deterministic ZIP without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk_path="$(find tested-apk -name app-arm64-v8a-debug.apk -type f)"
          test -n "$apk_path" && test -f "$apk_path"
          cp "$apk_path" flip-watcher-0.5.112-arm64.apk
          echo "ca64281d37cee5efc6250c9d22d0e91191efecef940bcfcba9a194f11f60c87d  flip-watcher-0.5.112-arm64.apk" | sha256sum -c -
          unzip -p flip-watcher-0.5.112-arm64.apk assets/ext/flip_poc/manifest.json | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(JSON.parse(s).version!=="0.5.112")process.exit(1)})'
          unzip -p flip-watcher-0.5.112-arm64.apk assets/ext/flip_poc/collector-core.js | sha256sum | grep -q '^32c98525cfac6b580b93b4847140d4872ee4119b26981786322235df42e5b88b '
          sha256sum flip-watcher-0.5.112-arm64.apk > SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Android 0.5.112 — pomiar zatrzymania obrazu w tle.
          Test obrazu porównuje tę samą grupę i rozmiar w widocznym oknie, bez widoku na pierwszym planie i po schowaniu aplikacji. Przez25sekund zapisuje pięć zestawów liczników animacji requestAnimationFrame, zwykłego timera, widoczności dokumentu oraz klatek ImageReader. Przechwycenie obrazu następuje dopiero po pomiarze.
          To wersja diagnostyczna, bez potwierdzonej naprawy skanowania w tle. Pętla animacji jest niewielkim bodźcem pomiarowym; wynik nie gwarantuje identycznego zachowania bez instrumentacji. Zwykły skaner pozostaje bez zmian. Eksperymentalna korekta pauzy111 pozostaje wyłącznie w ręcznie wybieranym czwartym wariancie; na telefonie sama nie rozwiązała problemu.
          Użycie: Test obrazu → Rozpocznij porównanie. Poczekaj na dwa etapy, potem Sprawdź po schowaniu aplikacji → Zwykły test w tle. Poczekaj około2minut przed powrotem. Raport zawiera wyłącznie liczniki; nie wysyła obrazu ani treści ofert.
          Instaluj jako aktualizację bez odinstalowywania. Parowanie, kolejka zdjęć i tekstów, logowanie, ustawienia, harmonogram i branding są zachowane. Testy obejmują porównanie na lokalnej stronie i aktualizację107→112; emulatorAPI36 nie zastępuje wyniku telefonuAPI37.
          Source: c89f49bc99bd03f4809fb0a558045cd4d21c2856. Verified run: 43702132914.
          NOTES
          python3 - <<'PYZIP'
          import zipfile,pathlib,hashlib,json
          apk=pathlib.Path('flip-watcher-0.5.112-arm64.apk');output=pathlib.Path('flip-watcher-0.5.112-arm64.zip')
          info=zipfile.ZipInfo(apk.name,date_time=(2026,11,14,0,0,0));info.compress_type=zipfile.ZIP_STORED;info.external_attr=0o100644 << 16
          with zipfile.ZipFile(output,'w') as z:z.writestr(info,apk.read_bytes())
          with zipfile.ZipFile(output) as z:
              assert z.namelist()==[apk.name]
              assert hashlib.sha256(z.read(apk.name)).digest()==hashlib.sha256(apk.read_bytes()).digest()
          metadata={'url':'https://github.com/jakubokruszek-wq/flip-manager-ai/releases/download/gecko-poc-0.5.112/'+output.name,'filename':output.name,'bytes':output.stat().st_size,'sha256':hashlib.sha256(output.read_bytes()).hexdigest(),'apkFilename':apk.name,'apkBytes':apk.stat().st_size,'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest()}
          pathlib.Path('release-delivery.json').write_text(json.dumps(metadata));print(json.dumps(metadata))
          PYZIP
          gh release create gecko-poc-0.5.112 flip-watcher-0.5.112-arm64.apk flip-watcher-0.5.112-arm64.zip SHA256SUMS --repo jakubokruszek-wq/flip-manager-ai --target c89f49bc99bd03f4809fb0a558045cd4d21c2856 --title 'Watcher 0.5.112 — pomiar obrazu, animacji i timera' --prerelease --notes-file release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: android-112-delivery-metadata
          path: release-delivery.json
          retention-days: 14
  verify-download:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c89f49bc99bd03f4809fb0a558045cd4d21c2856
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: android-112-delivery-metadata
          path: tested-delivery
      - run: npm ci --no-audit --no-fund
      - name: Use installed Chrome or install Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify ZIP full download, range resume, actual Chrome save and enclosed APK
        run: node android/flip-watcher-gecko-poc/scripts/verify-release-download.mjs tested-delivery/release-delivery.json


