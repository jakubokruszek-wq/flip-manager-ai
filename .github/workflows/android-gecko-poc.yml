name: Inspect pinned Gecko background lifecycle
on:
  push:
    branches: [codex/android-gecko-background-api-audit]
    paths: [.github/workflows/android-gecko-poc.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect public sources of the exact pinned engine
        run: |
          set -euo pipefail
          base=https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/158.0.20261007201254/geckoview-158.0.20261007201254
          if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 30 "$base-sources.jar" -o sources.jar; then
            python3 - <<'PY'
          import zipfile,re
          z=zipfile.ZipFile('sources.jar')
          pattern=re.compile(r'ActivityLifecycle|onActivityStopped|onActivityPaused|onActivityStarted|onActivityResumed|setActive\(|onPause\(|onResume\(|[Bb]ackground|[Ff]oreground|[Pp]auseCompositor|[Rr]esumeCompositor')
          for name in z.namelist():
            if not name.endswith('.java'):continue
            data=z.read(name).decode('utf8','replace').splitlines()
            if not (any(name.endswith(x) for x in ['GeckoRuntime.java','GeckoSession.java','GeckoView.java','GeckoAppShell.java','GeckoThread.java']) or any('ActivityLifecycle' in line for line in data)):continue
            indexes={i for i,line in enumerate(data) if pattern.search(line)}
            if not indexes:continue
            print('\nSOURCE '+name)
            selected=sorted({j for i in indexes for j in range(max(0,i-5),min(len(data),i+12))})
            for i in selected[:260]:print(str(i+1)+': '+data[i])
          PY
          else
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 45 "$base.aar" -o gecko.aar
            unzip -p gecko.aar classes.jar > classes.jar
            for cls in org.mozilla.geckoview.GeckoRuntime org.mozilla.geckoview.GeckoSession org.mozilla.gecko.GeckoAppShell; do
              javap -p -classpath classes.jar "$cls" || true
            done
          fi
