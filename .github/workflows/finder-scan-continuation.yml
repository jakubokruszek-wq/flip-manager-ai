name: Finder scan continuation

on:
  schedule:
    # Run shortly after the hour so the previous cycle has settled.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: finder-scan-continuation
  cancel-in-progress: false

jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Continue pending Finder sources
        shell: bash
        env:
          CONTINUATION_URL: https://flip-manager-ai.vercel.app/api/jobs/finder-scan-continuation
          OIDC_AUDIENCE: flip-manager-finder-continuation
        run: |
          set -euo pipefail

          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<<"${oidc_response}")"

          # The route acknowledges and defers the actual claim-and-process
          # loop to the platform's background-task primitive (see route.ts),
          # so a 202 here means this cycle was accepted, not that it already
          # drained every pending row -- its real outcome is only in the
          # function logs. Draining several pending rows no longer comes
          # from retrying in one job run; it comes from how often this
          # trigger (or a higher-frequency external one) fires.
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          http_status="$(curl --silent --show-error --location \
            -H "Authorization: Bearer ${oidc_token}" \
            -o "${response_file}" -w '%{http_code}' \
            "${CONTINUATION_URL}" || true)"

          if [[ "${http_status}" != "202" ]]; then
            echo "Finder continuation request failed with HTTP ${http_status}."
            exit 1
          fi
          jq -e '.status == "accepted"' "${response_file}" >/dev/null
