name: Facebook Android offline system and APK
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: facebook-android-system-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-system:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-facebook-android-tests' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flip_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: flip_android_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U flip_test -d flip_android_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install 'psycopg[binary]==3.2.6'
      - name: Validate real PostgreSQL before starting fixture API
        run: python scripts/test-facebook-android-postgres.py
      - name: Local fixture and existing algorithm regression
        run: npm run test:facebook-android-offline
      - name: Provision ephemeral loopback HTTPS fixture
        run: |
          set -euo pipefail
          export FLIP_TEST_TLS_KEY="$RUNNER_TEMP/flip-ci.key"
          export FLIP_TEST_TLS_CERT="$RUNNER_TEMP/flip-ci.pem"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$FLIP_TEST_TLS_KEY" -out "$FLIP_TEST_TLS_CERT" -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1,IP:10.0.2.2'
          cp "$FLIP_TEST_TLS_CERT" android/flip-collector/app/src/androidTest/assets/isolated-test-cert.pem
          python scripts/facebook-android-test-db.py > "$RUNNER_TEMP/flip-db.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/flip-db.pid"
          node --import ./scripts/test-alias-loader.mjs scripts/facebook-android-test-api.ts > "$RUNNER_TEMP/flip-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/flip-api.pid"
          for attempt in $(seq 1 30); do
            if curl --silent --fail --cacert "$FLIP_TEST_TLS_CERT" https://localhost:55441/__test/health; then break; fi
            sleep 1
          done
          curl --silent --fail --cacert "$FLIP_TEST_TLS_CERT" https://localhost:55441/__test/health
      - name: Compile, JVM tests and APK
        working-directory: android/flip-collector
        run: ./gradlew --no-daemon compileDebugKotlin compileDebugAndroidTestKotlin testDebugUnitTest assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android 16 WebView to signed API and PostgreSQL
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android/flip-collector
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.isolatedApiOrigin=https://10.0.2.2:55441
      - name: Verify side-by-side APK identity and flag
        run: |
          set -euo pipefail
          apk=android/flip-collector/app/build/outputs/apk/debug/app-debug.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-identity.txt"
          grep -q "package: name='pl.jakubokruszek.flipcollector.integration'" "$RUNNER_TEMP/apk-identity.txt"
          grep -q 'LIVE_COLLECTION_ENABLED = false' android/flip-collector/app/build/generated/source/buildConfig/debug/pl/jakubokruszek/flipcollector/BuildConfig.java
          sha256sum "$apk"
      - name: APK only after all preceding checks pass
        uses: actions/upload-artifact@v4
        with:
          name: flip-collector-offline-validated-${{ github.sha }}
          path: android/flip-collector/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-android-system-reports-${{ github.sha }}
          path: |
            android/flip-collector/app/build/reports/tests/
            android/flip-collector/app/build/reports/androidTests/
            android/flip-collector/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated fixture processes
        if: always()
        run: |
          for name in flip-db flip-api; do
            if test -f "$RUNNER_TEMP/$name.pid"; then kill "$(cat "$RUNNER_TEMP/$name.pid")" || true; fi
          done
