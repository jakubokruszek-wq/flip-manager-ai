name: Price Radar daily scheduler

on:
  schedule:
    # The server reads each owner's saved Europe/Warsaw time and decides
    # whether this lightweight tick should start or continue a durable run.
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: price-radar-scheduler
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'jakubokruszek-wq/flip-manager-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Continue the durable Radar checkpoint
        env:
          PRICE_RADAR_COLLECT_URL: https://flip-manager-ai.vercel.app/api/jobs/price-radar-collect
          PRICE_RADAR_CRON_SECRET: ${{ secrets.PRICE_RADAR_CRON_SECRET }}
          MAX_REQUESTS: "24"
          MAX_ELAPSED_MS: "3300000"
        run: node scripts/price-radar-scheduler.mjs
