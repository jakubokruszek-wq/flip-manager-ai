name: Investment workspace lifecycle
on:
  push:
    branches: [codex/investment-workspace, codex/property-assessment, codex/mobile-attachments-and-reposts, codex/automatic-flip-costs, codex/simple-price-entry, codex/in-app-camera-download, codex/all-assumptions-thousands, codex/saved-invoice-and-sparse-reposts, codex/invoice-fields-estimate-fix, codex/android-088-resumable-download, codex/android-089-download, codex/android-download-completion, codex/android-090-download, codex/android-091-download, codex/android-092-download, codex/android-093-download]
  pull_request:
    paths: ['features/android-download/**', 'app/android/**', 'app/api/android/**', 'lib/supabase/auth-proxy.ts', 'features/settings/components/settings-page.tsx', 'features/property-workspace/**', 'app/api/properties/**', 'app/(app)/investments/**', 'supabase/migrations/*property_workspaces.sql', '.github/workflows/investment-workspace.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --import ./scripts/test-alias-loader.mjs --experimental-test-module-mocks --test features/facebook-watcher/group-facebook-reposts.test.ts features/android-download/download.test.ts features/android-download/exact-stream.test.ts features/property-workspace/invoice-fields.test.ts features/property-workspace/invoice-ai.test.ts features/property-workspace/price-entry.test.ts features/property-workspace/assessment.test.ts features/property-workspace/model.test.ts features/property-workspace/database.test.ts config/navigation.test.ts features/properties/property-update.test.ts features/properties/server/property-delete-route.test.ts
      - name: Verify complete real APK and resumed download
        env:
          ANDROID_APK_LIVE_CHECK: ${{ (github.head_ref == 'codex/in-app-camera-download' || github.ref_name == 'codex/in-app-camera-download' || github.head_ref == 'codex/android-088-resumable-download' || github.ref_name == 'codex/android-088-resumable-download' || github.head_ref == 'codex/android-089-download' || github.ref_name == 'codex/android-089-download' || github.head_ref == 'codex/android-download-completion' || github.ref_name == 'codex/android-download-completion' || github.head_ref == 'codex/android-090-download' || github.ref_name == 'codex/android-090-download' || github.head_ref == 'codex/android-091-download' || github.ref_name == 'codex/android-091-download' || github.head_ref == 'codex/android-092-download' || github.ref_name == 'codex/android-092-download' || github.head_ref == 'codex/android-093-download' || github.ref_name == 'codex/android-093-download') && '1' || '0' }}
        run: node --import ./scripts/test-alias-loader.mjs --test features/android-download/live-download.test.ts
      - run: npx tsc --noEmit --incremental false
      - run: npx eslint features/android-download app/android app/api/android lib/supabase/auth-proxy.ts features/settings/components/settings-page.tsx features/property-workspace app/api/properties config/navigation.ts components/layout/mobile-bottom-nav.tsx
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Use installed Chrome or install Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node --test features/property-workspace/workspace.browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investment-browser-screenshots
          path: test-artifacts/
