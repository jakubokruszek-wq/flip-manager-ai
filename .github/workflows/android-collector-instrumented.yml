name: Android Flip Collector instrumented tests (Android 16)

# Runs the WorkManager instrumented tests of android/flip-collector on an
# Android 16 (API 36) emulator on a GitHub-hosted runner (free for this public
# repository). Pull requests and manual runs only, so a push does not start the
# ~15 min emulator job twice. No secrets, no network calls from the tests.

on:
  pull_request:
    paths:
      - "android/flip-collector/**"
      - ".github/workflows/android-collector-instrumented.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-collector-instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android/flip-collector
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flip-collector-instrumented-reports-${{ github.run_number }}
          path: android/flip-collector/app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14
