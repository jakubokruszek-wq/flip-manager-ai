name: Android download diagnostics
on:
  push:
    branches: [codex/android-download-diagnostics]
permissions:
  contents: read
jobs:
  public-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual production APK download and interrupted resume
        env:
          ANDROID_APK_PUBLIC_CHECK: '1'
        run: node --experimental-strip-types --test features/android-download/public-download.test.mjs
