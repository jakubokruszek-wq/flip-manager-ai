name: Prepare locked investment dependencies
on:
  push:
    branches: [codex/investment-workspace]
    paths: [package.json, scripts/prepare-ocr-assets.mjs, .github/workflows/investment-bootstrap.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate dependency lock and a CLI-named migration
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npx --yes supabase@2.81.3 migration new property_workspaces
          migration_path="$(ls supabase/migrations/*_property_workspaces.sql)"
          cp docs/sql/property-workspaces.sql "$migration_path"
          echo "Generated migration: $migration_path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json "$migration_path"
          git diff --cached --quiet || git commit -m 'Lock local OCR dependencies and register the workspace migration'
          git push
